<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LLM Archive - Extension Options</title>
  <style>
    body {
      width: 600px;
      padding: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      margin: 0;
    }
    
    h1 {
      color: #1f2937;
      margin-bottom: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-right: 8px;
    }
    
    button:hover {
      background: #1d4ed8;
    }
    
    .secondary-button {
      background: #f3f4f6;
      color: #374151;
    }
    
    .secondary-button:hover {
      background: #e5e7eb;
    }
    
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
      display: none;
    }
    
    .status.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    
    .status.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    
    .help-text {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>LLM Archive Extension Settings</h1>
  
  <div class="form-group">
    <label for="api-base">API Base URL (optional)</label>
    <input type="url" id="api-base" placeholder="https://your-domain.replit.app/api">
    <div class="help-text">
      Leave empty to auto-detect. Use https://localhost:5000/api for local development or your production domain for deployed apps.
    </div>
  </div>
  
  <button id="save-btn">Save Settings</button>
  <button id="reset-btn" class="secondary-button">Reset to Auto-Detect</button>
  
  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
