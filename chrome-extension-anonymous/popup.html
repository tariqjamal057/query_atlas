<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      margin: 0;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .logo {
      width: 32px;
      height: 32px;
      background: #16a34a;
      border-radius: 6px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo svg {
      width: 20px;
      height: 20px;
      fill: white;
    }
    
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
    }
    
    .subtitle {
      font-size: 12px;
      color: #16a34a;
      font-weight: 500;
    }
    
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    
    .status.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    
    .status.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    
    .status.info {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #dbeafe;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    
    input, textarea, select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    
    button {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
    }
    
    button:hover {
      background: #15803d;
    }
    
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    
    .secondary-button {
      background: #f3f4f6;
      color: #374151;
    }
    
    .secondary-button:hover {
      background: #e5e7eb;
    }
    
    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b7280;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }
    
    .anonymous-info {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #166534;
    }
    
    .options-link {
      background: #6b7280;
      color: white;
      font-size: 12px;
      padding: 6px 12px;
    }
    
    .options-link:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 20 20">
        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <div>
      <h1>LLM Archive</h1>
      <div class="subtitle">Anonymous</div>
    </div>
  </div>

  <div id="status" class="status info" style="display: none;"></div>
  
  <div class="anonymous-info">
    💡 This version allows anonymous submissions without requiring sign-in.
  </div>

  <!-- Main Form (always visible) -->
  <div id="main-section">
    <div id="manual-form">
    <div class="form-group">
      <label for="query">Search Query</label>
      <input type="text" id="query" placeholder="What did you search for?">
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" id="autoShare" style="width: auto; margin-right: 8px;">
        Post and Share to Anyone on Internet (Claude only)
      </label>
      <div style="font-size: 12px; color: #6b7280; margin-top: 4px;">
        Automatically publish Claude conversation and capture share link
      </div>
    </div>

    <div class="form-group">
      <label for="publicLink">Public Share Link</label>
      <input type="url" id="publicLink" placeholder="https://chatgpt.com/share/...">
    </div>

    <div class="form-group">
      <label for="platform">Platform</label>
      <select id="platform">
        <option value="ChatGPT">ChatGPT</option>
        <option value="Claude">Claude</option>
        <option value="Gemini">Gemini</option>
        <option value="DeepSeek">DeepSeek</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="description">Description (optional)</label>
      <textarea id="description" placeholder="Brief description of the conversation..."></textarea>
    </div>

      <button id="submit-btn">Submit to Archive</button>
      <button id="auto-capture-btn" class="secondary-button">🚀 Auto-Capture</button>
      <button id="options-btn" class="options-link">⚙️ Options</button>
    </div>

    <div class="stats">
      <span>Total Captured: <span id="captured-count">0</span></span>
      <span>This Session: <span id="session-count">0</span></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
