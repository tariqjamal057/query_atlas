<!DOCTYPE html>
<html>
<head>
  <title>Authentication Complete</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      margin: 40px; 
      text-align: center;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 300px;
      margin: 0 auto;
    }
    .success { color: #28a745; font-size: 32px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="success">✅</div>
    <div>Authentication successful!</div>
    <div>This window will close automatically.</div>
  </div>

  <script>
    // Extract token from URL fragment
    const fragment = window.location.hash.substring(1);
    const params = new URLSearchParams(fragment);
    const token = params.get('token');
    const expires = params.get('expires');
    
    if (token) {
      // Store token in extension storage
      chrome.storage.local.set({
        authToken: token,
        tokenExpiry: expires || (Date.now() + 24*60*60*1000)
      }, () => {
        // Close the window after storing token
        window.close();
      });
    } else {
      // No token found, show error
      document.body.innerHTML = '<div class="container"><div style="color: red;">❌</div><div>Authentication failed</div></div>';
    }
  </script>
</body>
</html>
